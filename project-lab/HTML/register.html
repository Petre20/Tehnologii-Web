<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Înregistrare</title>
    <link rel="stylesheet"
          href="../CSS/register_style.css">
</head>
<body>
    <main class="page">
        <section class="card">
            <h1>Înregistrează-te</h1>
            <form class="register-form"
                  action="#"
                  method="post"
                  enctype="multipart/form-data">
                <div class="row">
                    <label for="username">
                        Nume utilizator
                    </label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="ex: ioanaTW"
                        required>
                </div>
                <div class="row">
                    <label for="email">
                        Email
                    </label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="ex: nume@email.com"
                        required>
                </div>
                <div class="row two-col">
                    <div>
                        <label for="password">
                            Parolă
                        </label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            required>
                    </div>
                    <div>
                        <label for="confirm_password">
                            Confirmă parola
                        </label>
                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            required>
                    </div>
                </div>
                <div class="row">
                    <label for="birthdate">
                        Data nașterii
                    </label>
                    <input
                        type="date"
                        id="birthdate"
                        name="birthdate">
                </div>
                <div class="row">
                    <label>Gen</label>
                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="male">
                        Masculin
                    </label>
                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="female">
                        Feminin
                    </label>
                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="other">
                        Altul
                    </label>
                </div>
                <div class="row">
                    <label for="country">
                        Țară
                    </label>
                    <select
                        id="country"
                        name="country">
                        <option value="">
                            Selectează țara
                        </option>
                        <option value="romania">
                            România
                        </option>
                        <option value="germany">
                            Germania
                        </option>
                        <option value="france">
                            Franța
                        </option>
                        <option value="italy">
                            Italia
                        </option>
                    </select>
                </div>
                <div class="row">
                    <label>Interese</label>
                    <div class="checkbox-grid">
                        <label>
                            <input
                                type="checkbox"
                                name="interests"
                                value="web">
                            Web
                        </label>
                        <label>
                            <input
                                type="checkbox"
                                name="interests"
                                value="networking">
                            Networking
                        </label>
                        <label>
                            <input
                                type="checkbox"
                                name="interests"
                                value="linux">
                            Linux
                        </label>
                        <label>
                            <input
                                type="checkbox"
                                name="interests"
                                value="python">
                            Python
                        </label>
                    </div>
                </div>
                <div class="row">
                    <label for="profile_picture">
                        Poză de profil
                    </label>
                    <input
                        type="file"
                        id="profile_picture"
                        name="profile_picture">
                </div>
                <div class="row">
                    <label for="description">
                        Descriere
                    </label>
                    <textarea
                        id="description"
                        name="description"
                        rows="4"
                        placeholder="Spune câteva lucruri despre tine">
                    </textarea>
                </div>
                <div class="actions">
                    <button
                        type="submit"
                        class="btn primary">
                        Înregistrează-te
                    </button>
                    <button
                        type="reset"
                        class="btn ghost">
                        Resetează
                    </button>
                </div>
                <p class="login-link">
                    Ai deja cont?
                    <a href="login.html">
                        Mergi la login
                    </a>
                </p>
            </form>
        </section>
    </main>
</body>
</html>
