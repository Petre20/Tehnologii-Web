<!DOCTYPE html>
<html lang="ro">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Chatbot</title>

    <link rel="stylesheet"
          href="../CSS/chatbot_style.css">

</head>


<body>

    <main class="chat-page">

        <div class="chat-header">

            <h1>TW ChatBot</h1>

            <p>
                Răspunde la întrebări folosind a, b sau c.
            </p>

        </div>


        <div
            class="chat-container"
            id="chat-container">
        </div>


        <form id="chat-form">

            <input
                type="text"
                id="user-input"
                placeholder="Scrie răspunsul: a, b sau c..."
                autocomplete="off">

            <button type="submit">
                Trimite
            </button>

        </form>


        <a href="home.html"
           class="back-link">

            Înapoi la Home

        </a>

    </main>


    <script src="../JS/chatbot_js.js"></script>

</body>

</html>
